apiVersion: v1
kind: Secret
metadata:
  name: gitlab-credentials
  namespace: team-a
stringData:
  token: <token>
---
apiVersion: core.gitlab.hfl.dev/v1alpha1
kind: Connection
metadata:
  name: default
  namespace: team-a
spec:
  baseURL: https://gitlab.com/api/v4
  secretRef:
    name: gitlab-credentials
