apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-krm-extensions-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  namespace: gitlab-krm-extensions-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-krm-extensions
  template:
    metadata:
      labels:
        app: gitlab-krm-extensions
    spec:
      serviceAccountName: manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: ko://github.com/highfivelabs/gitlab-krm-extensions/cmd/manager
        args:
        - --leader-elect
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
