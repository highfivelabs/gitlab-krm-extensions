              disable_invite_members:
                description: If `true`, disables the invite members functionality for groups.
                nullable: true
                type: string
              elasticsearch_client_adapter:
                description: Faraday adapter used by the Elasticsearch Ruby Client. Defaults to `typhoeus`. Possible values are `typhoeus` and `net_http`. [Introduced](https://gitlab.com/gitlab-org/gitlab/-/issues/550805) in GitLab 18.5. Premium and Ultimate only.
                nullable: true
                type: string
              elasticsearch_indexed_field_length_limit:
                description: Maximum size of text fields to index by Elasticsearch. A value of `0` means no limit. This does not apply to repository and wiki indexing. Premium and Ultimate only.
                nullable: true
                type: string
              elasticsearch_indexed_file_size_limit_kb:
                description: Maximum size, in KB, of repository and wiki files that are indexed by Elasticsearch. Premium and Ultimate only.
                nullable: true
                type: string
              elasticsearch_max_bulk_concurrency:
                description: Maximum concurrency of Elasticsearch bulk requests per indexing operation. This only applies to repository indexing operations. Premium and Ultimate only.
                nullable: true
                type: string
              elasticsearch_max_bulk_size_mb:
                description: Maximum size of Elasticsearch bulk indexing requests in MB. This only applies to repository indexing operations. Premium and Ultimate only.
                nullable: true
                type: string
              elasticsearch_max_code_indexing_concurrency:
                description: Maximum concurrency of Elasticsearch code indexing background jobs. This only applies to repository indexing operations. Premium and Ultimate only.
                nullable: true
                type: string
              elasticsearch_replicas:
                description: "Number of replicas for Elasticsearch indices. Use an integer to set all indices to the same value. Use an object to set per-index values. For example: `{\"gitlab-production\": 1, \"gitlab-production-notes\": 2}`. When using an object, you must provide both `elasticsearch_shards` and `elasticsearch_replicas` for each index. If either value is missing for an index, that index is skipped. Premium and Ult"
                nullable: true
                type: string
              elasticsearch_requeue_workers:
                description: If `true`, enables automatic requeuing of indexing workers. This improves non-code indexing throughput by enqueuing Sidekiq jobs until all documents are processed. Premium and Ultimate only.
                nullable: true
                type: string
              elasticsearch_retry_on_failure:
                description: Maximum number of possible retries for Elasticsearch search requests. Premium and Ultimate only.
                nullable: true
                type: string
              elasticsearch_shards:
                description: "Number of shards for Elasticsearch indices. Use an integer to set all indices to the same value. Use an object to set per-index values. For example: `{\"gitlab-production\": 5, \"gitlab-production-notes\": 3}`. When using an object, you must provide both `elasticsearch_shards` and `elasticsearch_replicas` for each index. If either value is missing for an index, that index is skipped. Premium and Ultim"
                nullable: true
                type: string
              elasticsearch_worker_number_of_shards:
                description: Number of indexing worker shards. This improves non-code indexing throughput by enqueuing more parallel Sidekiq jobs. Default is `2`. Premium and Ultimate only.
                nullable: true
                type: string
              enforce_namespace_storage_limit:
                description: If `true`, enforces namespace storage limits.
                nullable: true
                type: string
              enforce_pipl_compliance:
                description: If `true`, enforces PIPL compliance on GitLab.com.
                nullable: true
                type: string
              geo_node_allowed_ips:
                description: Comma-separated list of IPs and CIDRs of allowed secondary nodes. For example, `1.1.1.1, 2.2.2.0/24`. GitLab Self-Managed, Premium and Ultimate only.
                nullable: true
                type: string
              geo_status_timeout:
                description: Number of seconds after which a request to get a secondary node status times out. GitLab Self-Managed, Premium and Ultimate only.
                nullable: true
                type: string
              globally_allowed_ips:
                description: Comma-separated list of IP addresses and CIDRs always allowed for inbound traffic. For example, `1.1.1.1, 2.2.2.0/24`.
                nullable: true
                type: string
              group_secrets_limit:
                description: "Maximum number of secrets allowed per group in Secrets Manager. Default: 500. To disable the limit, set to `0`. Ultimate only. [Introduced](https://gitlab.com/gitlab-org/gitlab/-/merge_requests/219436) in GitLab 18.9."
                nullable: true
                type: string
              lock_memberships_to_saml:
                description: If `true`, enforces a [global lock on SAML group memberships](https://docs.gitlab.com/user/group/saml_sso/group_sync/#global-saml-group-memberships-lock).
                nullable: true
                type: string
              max_personal_access_token_lifetime:
                description: Maximum allowable lifetime for access tokens in days. When left blank, default value of 365 is applied. When set, value must be 365 or less. When changed, existing access tokens with an expiration date beyond the maximum allowable lifetime are revoked. GitLab Self-Managed, Ultimate only. In GitLab 17.6 or later, the maximum lifetime limit can be [extended to 400 days](https://gitlab.com/gitlab-org
                nullable: true
                type: string
              max_ssh_key_lifetime:
                description: Maximum allowable lifetime for SSH keys in days. GitLab Self-Managed, Ultimate only. In GitLab 17.6 or later, the maximum lifetime limit can be [extended to 400 days](https://gitlab.com/gitlab-org/gitlab/-/issues/461901) by enabling a [feature flag](https://docs.gitlab.com/administration/feature_flags/) named `buffered_token_expiration_limit`.
                nullable: true
                type: string
              mirror_capacity_threshold:
                description: Minimum capacity to be available before scheduling more mirrors preemptively. Premium and Ultimate only.
                nullable: true
                type: string
              mirror_max_capacity:
                description: Maximum number of mirrors that can be synchronizing at the same time. Premium and Ultimate only.
                nullable: true
                type: string
              mirror_max_delay:
                description: Maximum time (in minutes) between updates that a mirror can have when scheduled to synchronize. Premium and Ultimate only.
                nullable: true
                type: string
              package_metadata_purl_types:
                description: List of [package registry metadata to sync](https://docs.gitlab.com/administration/settings/security_and_compliance/#choose-package-registry-metadata-to-sync). See [the list](https://gitlab.com/gitlab-org/gitlab/-/blob/ace16c20d5da7c4928dd03fb139692638b557fe3/app/models/concerns/enums/package_metadata.rb#L5) of the available values. GitLab Self-Managed, Ultimate only.
                nullable: true
                type: string
              password_lowercase_required:
                description: If `true`, passwords require at least one lowercase letter. Premium and Ultimate only.
                nullable: true
                type: string
              password_number_required:
                description: If `true`, passwords require at least one number. Premium and Ultimate only.
                nullable: true
                type: string
              password_symbol_required:
                description: If `true`, passwords require at least one symbol character. Premium and Ultimate only.
                nullable: true
                type: string
              password_uppercase_required:
                description: If `true`, passwords require at least one uppercase letter. Premium and Ultimate only.
                nullable: true
                type: string
              project_secrets_limit:
                description: "Maximum number of secrets allowed per project in Secrets Manager. Default: 100. To disable the limit, set to `0`. Ultimate only. [Introduced](https://gitlab.com/gitlab-org/gitlab/-/merge_requests/219436) in GitLab 18.9."
                nullable: true
                type: string
              scan_execution_policies_action_limit:
                description: Maximum number of `actions` per scan execution policy. Defaults to `0` and cannot be set above `20`.
                nullable: true
                type: string
              scan_execution_policies_schedule_limit:
                description: "Maximum number of `type: schedule` rules per scan execution policy. Defaults to `0` and cannot be set above `20`."
                nullable: true
                type: string
              secret_push_protection_available:
                description: If `true`, allows projects to enable secret push protection. This does not enable secret push protection. Ultimate only.
                nullable: true
                type: string
              security_approval_policies_limit:
                description: Maximum number of active merge request approval policies per security policy project. Defaults to `5` and cannot be set above `20`.
                nullable: true
                type: string
              security_mr_report_cache_lifetime_minutes:
                description: "Number of minutes to cache security reports on merge requests (10-60). Default: 10. Premium and Ultimate only. [Introduced](https://gitlab.com/gitlab-org/gitlab/-/merge_requests/223399) in GitLab 18.10."
                nullable: true
                type: string
              shared_runners_minutes:
                description: Set the maximum number of compute minutes that a group can use on instance runners per month. Premium and Ultimate only.
                nullable: true
                type: string
              unconfirmed_users_delete_after_days:
                description: Specifies how many days after account creation to delete users who have not confirmed their email. Only applicable if `delete_unconfirmed_users` is set to `true`. Must be `1` or greater. Default is `7`. GitLab Self-Managed, Premium and Ultimate only.
                nullable: true
                type: string
