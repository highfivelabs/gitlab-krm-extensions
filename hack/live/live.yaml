# Integrations. Deleting one turns it off: GitLab keeps it (active false)
# and still answers a read. The project integrations are on the run's
# project, one at a time (GitLab allows one external issue tracker at a
# time); the group ones on a subgroup of their own, with no projects, so
# GitLab has nothing to propagate them to. Their PUT requires the URL or
# token, which a read never returns at the top level: the drift step sends
# the whole object (driftFull).
- kind: IntegrationSlack
  replaceSample: true
  spec: {projectID: "{{var:project}}", webhook: "https://hfl-live.example/slack/{{name}}", push_events: true}
  change: {push_events: false}
  drift: true
  driftFull: true
  stays: deleting an integration turns it off (active false); GitLab still answers a read

