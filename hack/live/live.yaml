- kind: ProjectCicdCatalog
  before:
  - {method: POST, path: /projects, body: {name: "{{name}}", path: "{{name}}", namespace_id: "{{var:group}}", visibility: private, description: hfl live test, initialize_with_readme: true}, save: {catalogProject: id}}
  after:
