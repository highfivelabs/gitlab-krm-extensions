  replaceSample: true
  spec: {fullPath: "{{run}}/{{name}}"}

# A saved reply of the token's own user.
- kind: UserSavedReply
  replaceSample: true
  spec: {name: "{{name}}", content: first}
  change: {content: second}
  driftFull: true                  # the update needs name and content

# The avatar of a user made for the kind (1x1 PNGs).
- kind: UserAvatar
  before:
  - {method: POST, path: /users, body: {name: "{{name}}-u", username: "{{name}}-u", email: "{{name}}-u@hfl-live.example", force_random_password: true, skip_confirmation: true}, save: {avatarUser: id}}
  after:
  - {method: DELETE, path: "/users/{{var:avatarUser}}?hard_delete=true", ok: [404]}
  replaceSample: true
  spec: {user_id: "{{var:avatarUser}}", avatar: {name: avatar.png, contentType: image/png, contentBase64: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC"}}
  change: {avatar: {name: avatar.png, contentType: image/png, contentBase64: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGNgYPgPAAEDAQAIicLsAAAAAElFTkSuQmCC"}}
  noDrift: the avatar is write-only (a read answers its URL, not the image)

