openapi: 3.0.0
info:
  title: 'GitLab REST API: deploy keys supplement'
  version: '19.6'
paths:
  /api/v4/projects/{id}/deploy_keys/{key_id}/enable:
    post:
      operationId: postEnableDeployKey
      summary: Enable a deploy key
      description: Enables a deploy key for a project so this can be used. Returns the enabled key, with
        a status code 201 when successful.
      tags:
      - Deploy resources
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEntitiesDeployKey'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '400':
          description: Bad Request
      parameters:
      - name: id
        required: true
        description: ID or URL-encoded path of the project.
        schema:
          oneOf:
          - type: string
          - type: integer
        in: path
      - name: key_id
        required: true
        description: ID of the deploy key.
        schema:
          type: integer
        in: path
  /api/v4/projects/{id}/deploy_keys/{enabled_key_id}:
    get:
      operationId: getApiV4ProjectsIdDeployKeysEnabledKeyId
      summary: Retrieve a deploy key
      description: Retrieves a specified deploy key.
      tags:
      - Deploy resources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEntitiesDeployKeysProject'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '400':
          description: Bad Request
      parameters:
      - name: id
        required: true
        description: ID or URL-encoded path of the project.
        schema:
          oneOf:
          - type: string
          - type: integer
        in: path
      - name: enabled_key_id
        required: true
        schema:
          type: integer
        in: path
    put:
      operationId: putApiV4ProjectsIdDeployKeysEnabledKeyId
      summary: Update a deploy key
      description: Updates a deploy key for a project.
      tags:
      - Deploy resources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEntitiesDeployKey'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
      parameters:
      - name: id
        required: true
        description: ID or URL-encoded path of the project.
        schema:
          oneOf:
          - type: string
          - type: integer
        in: path
      - name: enabled_key_id
        required: true
        schema:
          type: integer
        in: path
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/putApiV4ProjectsIdDeployKeysKeyIdRequest'
    delete:
      operationId: deleteApiV4ProjectsIdDeployKeysEnabledKeyId
      summary: Delete a deploy key
      description: Deletes a deploy key from the project. If the deploy key is used only for this project,
        it is deleted from the system.
      tags:
      - Deploy resources
      responses:
        '204':
          description: Resource deleted
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '400':
          description: Bad Request
      parameters:
      - name: id
        required: true
        description: ID or URL-encoded path of the project.
        schema:
          oneOf:
          - type: string
          - type: integer
        in: path
      - name: enabled_key_id
        required: true
        schema:
          type: integer
        in: path
components:
  schemas:
    APIEntitiesDeployKey:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Sample key 25
        created_at:
          type: string
          format: date-time
          example: '2015-09-03T07:24:44.627Z'
        expires_at:
          type: string
          format: date-time
          example: '2020-09-03T07:24:44.627Z'
        last_used_at:
          type: string
          format: date-time
          example: '2020-09-03T07:24:44.627Z'
        key:
          type: string
          example: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAAAgQDNJAkI3Wdf0r13c8a5pEExB2YowPWCSVzfZV22pNBc1CuEbyYLHpUyaD0GwpGvFdx2aP7lMEk35k6Rz3ccBF6jRaVJyhsn5VNnW92PMpBJ/P1UebhXwsFHdQf5rTt082cSxWuk61kGWRQtk4ozt/J2DF/dIUVaLvc+z4HomT41fQ==
        usage_type:
          type: string
          example: auth
        fingerprint:
          type: string
          example: 4a:9d:64:15:ed:3a:e6:07:6e:89:36:b3:3b:03:05:d9
        fingerprint_sha256:
          type: string
          example: Jrs3LD1Ji30xNLtTVf9NDCj7kkBgPBb2pjvTZ3HfIgU
        projects_with_write_access:
          type: array
          items:
            $ref: '#/components/schemas/APIEntitiesProjectIdentity'
        projects_with_readonly_access:
          type: array
          items:
            $ref: '#/components/schemas/APIEntitiesProjectIdentity'
    APIEntitiesDeployKeysProject:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Sample key 25
        created_at:
          type: string
          format: date-time
          example: '2015-09-03T07:24:44.627Z'
        expires_at:
          type: string
          format: date-time
          example: '2020-09-03T07:24:44.627Z'
        last_used_at:
          type: string
          format: date-time
          example: '2020-09-03T07:24:44.627Z'
        key:
          type: string
          example: ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAAAgQDNJAkI3Wdf0r13c8a5pEExB2YowPWCSVzfZV22pNBc1CuEbyYLHpUyaD0GwpGvFdx2aP7lMEk35k6Rz3ccBF6jRaVJyhsn5VNnW92PMpBJ/P1UebhXwsFHdQf5rTt082cSxWuk61kGWRQtk4ozt/J2DF/dIUVaLvc+z4HomT41fQ==
        usage_type:
          type: string
          example: auth
        fingerprint:
          type: string
          example: 4a:9d:64:15:ed:3a:e6:07:6e:89:36:b3:3b:03:05:d9
        fingerprint_sha256:
          type: string
          example: Jrs3LD1Ji30xNLtTVf9NDCj7kkBgPBb2pjvTZ3HfIgU
        projects_with_write_access:
          type: array
          items:
            $ref: '#/components/schemas/APIEntitiesProjectIdentity'
        projects_with_readonly_access:
          type: array
          items:
            $ref: '#/components/schemas/APIEntitiesProjectIdentity'
        can_push:
          type: boolean
    APIEntitiesProjectIdentity:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        description:
          type: string
          example: desc
        name:
          type: string
          example: project1
        name_with_namespace:
          type: string
          example: John Doe / project1
        path:
          type: string
          example: project1
        path_with_namespace:
          type: string
          example: namespace1/project1
        created_at:
          type: string
          format: date-time
          example: '2020-05-07T04:27:17.016Z'
    putApiV4ProjectsIdDeployKeysKeyIdRequest:
      type: object
      properties:
        title:
          type: string
          description: Title of the deploy key. At least one of `title`, `can_push` must be provided.
          nullable: true
        can_push:
          type: boolean
          description: If `true`, the deploy key can push to the project's repository. At least one of
            `title`, `can_push` must be provided.
          nullable: true
