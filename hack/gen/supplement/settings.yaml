openapi: 3.0.0
info:
  title: 'GitLab REST API: settings supplement'
  version: '19.6'
paths:
  /api/v4/projects/{id}/mirror/pull:
    get:
      operationId: getApiV4ProjectsIdMirrorPull
      summary: Retrieve project pull mirror details
      description: Retrieves pull mirror details for a specified project.
      tags:
      - Project mirrors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEntitiesPullMirror'
        '400':
          description: The project is not mirrored
        '404':
          description: Not Found
      parameters:
      - name: id
        required: true
        description: ID or URL-encoded path of the project.
        schema:
          oneOf:
          - type: string
          - type: integer
        in: path
      x-gitlab-tier: premium
    put:
      operationId: putApiV4ProjectsIdMirrorPull
      summary: Update project pull mirroring settings
      description: Updates pull mirroring settings for a specified project. This feature was introduced in GitLab 17.5.
      tags:
      - Project mirrors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIEntitiesPullMirror'
        '400':
          description: 'Url is blocked: Only allowed schemes are http, https, ssh, git'
        '404':
          description: Not Found
      parameters:
      - name: id
        required: true
        description: ID or URL-encoded path of the project.
        schema:
          oneOf:
          - type: string
          - type: integer
        in: path
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/putApiV4ProjectsIdMirrorPullRequest'
      x-gitlab-tier: premium
      x-gitlab-lifecycle: experiment
  /api/v4/projects/{id}/pages:
    get:
      operationId: getApiV4ProjectsIdPages
      summary: Retrieve Pages settings for a project
      description: Retrieves Pages settings for a specified project. You must have the Maintainer or Owner role for the project.
      tags:
      - GitLab Pages
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagesSettings'
        '404':
          description: Not found
      parameters:
      - name: id
        required: true
        description: ID or URL-encoded path of the project.
        schema:
          oneOf:
          - type: string
          - type: integer
        in: path
    patch:
      operationId: patchApiV4ProjectsIdPages
      summary: Update Pages settings for a project
      description: Updates Pages settings for a specified project. You must have the Maintainer or Owner role for the project.
      tags:
      - GitLab Pages
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagesSettings'
        '404':
          description: Not found
      parameters:
      - name: id
        required: true
        description: ID or URL-encoded path of the project.
        schema:
          oneOf:
          - type: string
          - type: integer
        in: path
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/patchApiV4ProjectsIdPagesRequest'
components:
  schemas:
    APIEntitiesPullMirror:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 101486
        update_status:
          type: string
          example: finished
        url:
          type: string
          example: https://*****:*****@gitlab.com/gitlab-org/security/gitlab.git
        last_error:
          type: string
        last_update_at:
          type: string
          format: date-time
          example: '2020-01-06T17:32:02.823Z'
        last_update_started_at:
          type: string
          format: date-time
          example: '2020-01-06T17:32:02.823Z'
        last_successful_update_at:
          type: string
          format: date-time
          example: '2020-01-06T17:32:02.823Z'
        enabled:
          type: boolean
          example: false
        mirror_trigger_builds:
          type: boolean
          example: false
        only_mirror_protected_branches:
          type: boolean
          example: false
        mirror_overwrites_diverged_branches:
          type: boolean
          example: false
        mirror_branch_regex:
          type: string
          example: branch_name
    PagesSettings:
      type: object
      description: Pages settings for a project.
      properties:
        url:
          type: string
        is_unique_domain_enabled:
          type: boolean
        force_https:
          type: boolean
        primary_domain:
          type: string
        deployments:
          type: array
          description: Current Pages deployments.
          items:
            type: object
            properties:
              created_at:
                type: string
                format: date-time
              url:
                type: string
              path_prefix:
                type: string
              root_directory:
                type: string
    patchApiV4ProjectsIdPagesRequest:
      type: object
      properties:
        pages_unique_domain_enabled:
          type: boolean
          description: If `true`, uses a unique domain.
          nullable: true
        pages_https_only:
          type: boolean
          description: If `true`, forces HTTPS.
          nullable: true
        pages_primary_domain:
          type: string
          description: Primary domain, from the existing assigned domains, to redirect all Pages requests to. [Introduced](https://gitlab.com/gitlab-org/gitlab/-/issues/481334)
            in GitLab 17.8.
          nullable: true
    putApiV4ProjectsIdMirrorPullRequest:
      type: object
      properties:
        enabled:
          type: boolean
          description: If `true`, enables pull mirroring on the project. At least one of `enabled`, `url`, `auth_user`, `auth_password`,
            `mirror_overwrites_diverged_branches`, `mirror_trigger_builds`, `only_mirror_protected_branches`, `mirror_branch_regex`
            must be provided.
          nullable: true
        url:
          type: string
          description: URL of the remote repository being mirrored. At least one of `enabled`, `url`, `auth_user`, `auth_password`,
            `mirror_overwrites_diverged_branches`, `mirror_trigger_builds`, `only_mirror_protected_branches`, `mirror_branch_regex`
            must be provided.
          nullable: true
        auth_user:
          type: string
          description: Username used to authenticate a project pull mirror. At least one of `enabled`, `url`, `auth_user`,
            `auth_password`, `mirror_overwrites_diverged_branches`, `mirror_trigger_builds`, `only_mirror_protected_branches`,
            `mirror_branch_regex` must be provided.
          nullable: true
        auth_password:
          type: string
          description: Password used to authenticate a project pull mirror, or a personal access token with the `api` scope
            enabled. At least one of `enabled`, `url`, `auth_user`, `auth_password`, `mirror_overwrites_diverged_branches`,
            `mirror_trigger_builds`, `only_mirror_protected_branches`, `mirror_branch_regex` must be provided.
          nullable: true
        mirror_trigger_builds:
          type: boolean
          description: If `true`, triggers pipelines for mirror updates. At least one of `enabled`, `url`, `auth_user`, `auth_password`,
            `mirror_overwrites_diverged_branches`, `mirror_trigger_builds`, `only_mirror_protected_branches`, `mirror_branch_regex`
            must be provided.
          nullable: true
        only_mirror_protected_branches:
          type: boolean
          description: If `true`, limits mirroring to only protected branches. Mutually exclusive with `mirror_branch_regex`.
            At least one of `enabled`, `url`, `auth_user`, `auth_password`, `mirror_overwrites_diverged_branches`, `mirror_trigger_builds`,
            `only_mirror_protected_branches`, `mirror_branch_regex` must be provided.
          nullable: true
        mirror_overwrites_diverged_branches:
          type: boolean
          description: If `true`, overwrites diverged branches. At least one of `enabled`, `url`, `auth_user`, `auth_password`,
            `mirror_overwrites_diverged_branches`, `mirror_trigger_builds`, `only_mirror_protected_branches`, `mirror_branch_regex`
            must be provided.
          nullable: true
        mirror_branch_regex:
          type: string
          description: Regular expression for branch names to mirror. Only branches with names matching the regex are mirrored.
            Requires `only_mirror_protected_branches` to be disabled. Mutually exclusive with `only_mirror_protected_branches`.
            At least one of `enabled`, `url`, `auth_user`, `auth_password`, `mirror_overwrites_diverged_branches`, `mirror_trigger_builds`,
            `only_mirror_protected_branches`, `mirror_branch_regex` must be provided.
          nullable: true
