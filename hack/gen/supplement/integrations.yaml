components:
  schemas:
    APIEntitiesIntegration:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 75
        title:
          type: string
          example: Jenkins CI
        slug:
          type: string
          example: jenkins
        created_at:
          type: string
          format: date-time
          example: '2019-11-20T11:20:25.297Z'
        updated_at:
          type: string
          format: date-time
          example: '2019-11-20T12:24:37.498Z'
        active:
          type: boolean
        commit_events:
          type: boolean
        push_events:
          type: boolean
        issues_events:
          type: boolean
        incident_events:
          type: boolean
        alert_events:
          type: boolean
        confidential_issues_events:
          type: boolean
        merge_requests_events:
          type: boolean
        tag_push_events:
          type: boolean
        deployment_events:
          type: boolean
        note_events:
          type: boolean
        confidential_note_events:
          type: boolean
        pipeline_events:
          type: boolean
        wiki_page_events:
          type: boolean
        job_events:
          type: boolean
        comment_on_event_enabled:
          type: boolean
        inherited:
          type: boolean
        vulnerability_events:
          type: boolean
        properties:
          type: object
          example:
            token: secr3t
    APIEntitiesIntegrationBasic:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 75
        title:
          type: string
          example: Jenkins CI
        slug:
          type: string
          example: jenkins
        created_at:
          type: string
          format: date-time
          example: '2019-11-20T11:20:25.297Z'
        updated_at:
          type: string
          format: date-time
          example: '2019-11-20T12:24:37.498Z'
        active:
          type: boolean
        commit_events:
          type: boolean
        push_events:
          type: boolean
        issues_events:
          type: boolean
        incident_events:
          type: boolean
        alert_events:
          type: boolean
        confidential_issues_events:
          type: boolean
        merge_requests_events:
          type: boolean
        tag_push_events:
          type: boolean
        deployment_events:
          type: boolean
        note_events:
          type: boolean
        confidential_note_events:
          type: boolean
        pipeline_events:
          type: boolean
        wiki_page_events:
          type: boolean
        job_events:
          type: boolean
        comment_on_event_enabled:
          type: boolean
        inherited:
          type: boolean
        vulnerability_events:
          type: boolean
    putApiV4GroupsIdIntegrationsDatadogRequest:
      type: object
      properties:
        datadog_site:
          type: string
          description: Datadog site to send data to. Learn more about Datadog sites in the <a target="_blank" rel="noopener
            noreferrer" href="https://docs.datadoghq.com/getting_started/site/">documentation</a>.
          nullable: true
        api_url:
          type: string
          description: Full URL of your Datadog site. Only required if you do not use a standard Datadog site.
          nullable: true
        api_key:
          type: string
          description: <a target="_blank" rel="noopener noreferrer" href="https://docs.datadoghq.com/account_management/api-app-keys/">API
            key</a> used for authentication with Datadog.
          nullable: true
        datadog_ci_visibility:
          type: boolean
          description: Enable CI Visibility
          nullable: true
        archive_trace_events:
          type: boolean
          description: When enabled, job logs are collected by Datadog and displayed along with pipeline execution traces.
          nullable: true
        datadog_service:
          type: string
          description: Tag all pipeline data from this GitLab instance in Datadog. Can be used when managing several self-managed
            deployments.
          nullable: true
        datadog_env:
          type: string
          description: For self-managed deployments, `env` tag for all the data sent to Datadog.
          nullable: true
        datadog_tags:
          type: string
          description: Custom tags in Datadog. Specify one tag per line in the format `key:value\nkey2:value2`.
          nullable: true
        pipeline_events:
          type: boolean
          description: Trigger event when a pipeline status changes.
          nullable: true
        build_events:
          type: boolean
          description: Trigger event when a build is created.
          nullable: true
        push_events:
          type: boolean
          description: Trigger event for pushes to the repository.
          nullable: true
        merge_requests_events:
          type: boolean
          description: Trigger event when a merge request is created, updated, or merged.
          nullable: true
        note_events:
          type: boolean
          description: Trigger event for new comments.
          nullable: true
        tag_push_events:
          type: boolean
          description: Trigger event for new tags pushed to the repository.
          nullable: true
        subgroup_events:
          type: boolean
          nullable: true
        project_events:
          type: boolean
          nullable: true
        use_inherited_settings:
          type: boolean
          description: Indicates whether to inherit the default settings. Defaults to `false`.
          nullable: true
      required:
      - api_key
    putApiV4GroupsIdIntegrationsHarborRequest:
      type: object
      properties:
        url:
          type: string
          description: The base URL to the Harbor instance linked to the GitLab project. For example, `https://demo.goharbor.io`.
          nullable: true
        project_name:
          type: string
          description: The name of the project in the Harbor instance. For example, `testproject`.
          nullable: true
        username:
          type: string
          description: The username created in the Harbor interface.
          nullable: true
        password:
          type: string
          description: The password of the user.
          nullable: true
        use_inherited_settings:
          type: boolean
          description: Indicates whether to inherit the default settings. Defaults to `false`.
          nullable: true
      required:
      - url
      - project_name
      - username
      - password
    putApiV4GroupsIdIntegrationsJiraRequest:
      type: object
      properties:
        url:
          type: string
          description: The URL to the Jira project which is being linked to this GitLab project (for example, `https://jira.example.com`).
          nullable: true
        api_url:
          type: string
          description: The base URL to the Jira instance API. Web URL value is used if not set (for example, `https://jira-api.example.com`).
          nullable: true
        jira_auth_type:
          type: integer
          description: The authentication method to use with Jira. Use `0` for basic authentication, `1` for Jira personal
            access token, and `2` for Jira Cloud service accounts. Defaults to `0`.
          nullable: true
        username:
          type: string
          description: The email or username to use with Jira. Use an email for Jira Cloud, and a username for Jira Data Center
            and Jira Server. Required when using basic authentication (`jira_auth_type` is `0`).
          nullable: true
        password:
