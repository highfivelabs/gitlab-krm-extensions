# A compliance framework of a top-level group. GraphQL only. GitLab
# Premium (Ultimate for pipelineConfigurationFullPath).
#
# The read lists the group's frameworks with that ID
# (namespace.complianceFrameworks(id)) and takes the one it finds.
#
# Sources:
#   - gitlabhq/terraform-provider-gitlab v19.5.0,
#     internal/provider/resource_gitlab_compliance_framework.go: the four
#     documents below, as Terraform sends them (named here: GraphQL lets an
#     operation be named; the fake API answers by name); params is the
#     spec's body.
#   - GitLab's GraphQL reference: mutations createComplianceFramework,
#     updateComplianceFramework, destroyComplianceFramework, input type
#     ComplianceFrameworkInput (color, default, description, name,
#     pipelineConfigurationFullPath), Namespace.complianceFrameworks:
#     https://docs.gitlab.com/api/graphql/reference/#mutationcreatecomplianceframework
# Written 2026-11-22.
terraform: [gitlab_compliance_framework]
shape: crud
params:
  namespacePath:
    description: Full path of the namespace (a top-level group) to add the compliance framework to.
fields:
  name:
    type: string
    description: Name for the compliance framework.
  description:
    type: string
    description: Description for the compliance framework.
  color:
    type: string
    description: Color representation of the compliance framework in hex format, e.g. #FCA121.
  default:
    type: boolean
    description: Set this compliance framework as the default framework for the group.
  pipelineConfigurationFullPath:
    type: string
    description: "Full path of the compliance pipeline configuration stored in a project repository, such as .gitlab/.compliance-gitlab-ci.yml@compliance/hipaa. Deprecated in GitLab 17.4: use pipeline execution policies instead. GitLab Ultimate."
required: [name, description, color]
sample: {namespacePath: example-group, name: example-name, description: example-description, color: "#FCA121"}
create:
  query: |
    mutation CreateComplianceFramework($namespacePath: ID!, $params: ComplianceFrameworkInput!) {
      createComplianceFramework(input: {params: $params, namespacePath: $namespacePath}) {
        framework { id, name, description, color, default, pipelineConfigurationFullPath }
        errors
      }
    }
  variables: {namespacePath: "{namespacePath}", params: $body}
  result: createComplianceFramework/framework
read:
  query: |
    query ComplianceFramework($fullPath: ID!, $id: ComplianceManagementFrameworkID!) {
      namespace(fullPath: $fullPath) {
        fullPath,
        complianceFrameworks(id: $id) {
          nodes { id, name, description, color, default, pipelineConfigurationFullPath }
        }
      }
    }
  variables: {fullPath: "{namespacePath}", id: "{id}"}
  result: namespace/complianceFrameworks/nodes
  find: {field: id}
update:
  query: |
    mutation UpdateComplianceFramework($id: ComplianceManagementFrameworkID!, $params: ComplianceFrameworkInput!) {
      updateComplianceFramework(input: {params: $params, id: $id}) {
        complianceFramework { id, name, description, color, default, pipelineConfigurationFullPath }
        errors
      }
    }
  variables: {id: "{id}", params: $body}
  result: updateComplianceFramework/complianceFramework
delete:
  query: |
    mutation DestroyComplianceFramework($id: ComplianceManagementFrameworkID!) {
      destroyComplianceFramework(input: {id: $id}) {
        errors
      }
    }
  variables: {id: "{id}"}
