# A compliance framework of a top-level group, made from one of GitLab's
# templates. GraphQL only. GitLab Premium.
#
# templateId is taken only when the framework is made: a read never answers
# it and an update cannot change it (delete and recreate the object). The
# read lists the group's frameworks with that ID and takes the one it
# finds; an update is updateComplianceFramework's, as any framework's.
#
# Sources:
#   - gitlabhq/terraform-provider-gitlab v19.5.0,
#     internal/provider/resource_gitlab_compliance_framework_from_template.go:
#     the four documents below, as Terraform sends them (named here: GraphQL
#     lets an operation be named; the fake API answers by name).
#   - GitLab's GraphQL reference: mutation
#     createComplianceFrameworkFromTemplate (color, default, description,
#     name, namespacePath ID!, templateId
#     ComplianceManagementFrameworksTemplateRegistryTemplateID!),
#     updateComplianceFramework, destroyComplianceFramework:
#     https://docs.gitlab.com/api/graphql/reference/#mutationcreatecomplianceframeworkfromtemplate
# Written 2026-11-22.
terraform: [gitlab_compliance_framework_from_template]
shape: crud
params:
  namespacePath:
    description: Full path of the namespace (a top-level group) to add the compliance framework to.
fields:
  templateId:
    type: string
    description: "Unique identifier of the template to create the framework from, in the format gid://gitlab/ComplianceManagement::Frameworks::TemplateRegistry::Template/<template id>. Taken only when the framework is made."
  name:
    type: string
    description: Override the name of the compliance framework.
  description:
    type: string
    description: Override the description of the compliance framework.
  color:
    type: string
    description: Override the color of the compliance framework in hex format, e.g. #FCA121.
  default:
    type: boolean
    description: Set this compliance framework as the default framework for the group.
required: [templateId]
writeOnly: [templateId]
createOnly: [templateId]
sample: {namespacePath: example-group, templateId: "gid://gitlab/ComplianceManagement::Frameworks::TemplateRegistry::Template/example", name: example-name}
create:
  query: |
    mutation CreateComplianceFrameworkFromTemplate($namespacePath: ID!, $templateId: ComplianceManagementFrameworksTemplateRegistryTemplateID!, $color: String, $default: Boolean, $description: String, $name: String) {
      createComplianceFrameworkFromTemplate(input: {namespacePath: $namespacePath, templateId: $templateId, color: $color, default: $default, description: $description, name: $name}) {
        framework { id, name, description, color, default }
        errors
      }
    }
  variables: {namespacePath: "{namespacePath}", templateId: "{templateId}", color: "{color}", default: "{default}", description: "{description}", name: "{name}"}
  result: createComplianceFrameworkFromTemplate/framework
read:
  query: |
    query ComplianceFrameworkFromTemplate($fullPath: ID!, $id: ComplianceManagementFrameworkID!) {
      namespace(fullPath: $fullPath) {
        fullPath,
        complianceFrameworks(id: $id) {
          nodes { id, name, description, color, default }
        }
      }
    }
  variables: {fullPath: "{namespacePath}", id: "{id}"}
  result: namespace/complianceFrameworks/nodes
  find: {field: id}
update:
  query: |
    mutation UpdateComplianceFrameworkFromTemplate($id: ComplianceManagementFrameworkID!, $params: ComplianceFrameworkInput!) {
      updateComplianceFramework(input: {params: $params, id: $id}) {
        complianceFramework { id, name, description, color, default }
        errors
      }
    }
  variables:
    id: "{id}"
    params: {color: "{color}", default: "{default}", description: "{description}", name: "{name}"}
  result: updateComplianceFramework/complianceFramework
delete:
  query: |
    mutation DestroyComplianceFrameworkFromTemplate($id: ComplianceManagementFrameworkID!) {
      destroyComplianceFramework(input: {id: $id}) {
        errors
      }
    }
  variables: {id: "{id}"}
