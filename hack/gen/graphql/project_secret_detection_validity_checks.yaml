# Secret detection validity checks for a project: on or off. GraphQL only.
# GitLab Ultimate.
#
# A settings kind: deleting the object leaves the setting as it is. The
# read names the project by its global ID (gid://gitlab/Project/<id>, from
# projectId), the mutation by its full path (fullPath). The read and the
# mutation alias validityChecksEnabled as enable, the mutation's input
# name, so that the API answers the spec's own field.
#
# Sources:
#   - gitlabhq/terraform-provider-gitlab v19.5.0,
#     internal/provider/resource_gitlab_project_secret_detection_validity_checks.go:
#     the query securityConfiguration(projectId: "gid://gitlab/Project/<id>")
#     { validityChecksEnabled } and the mutation setValidityChecks(input:
#     {namespacePath, enable}) { validityChecksEnabled errors }. Terraform
#     writes the values into the documents; here they are variables.
#   - GitLab's GraphQL reference: Query.securityConfiguration (projectId
#     ProjectID!), mutation setValidityChecks (input type
#     SetValidityChecksInput: enable Boolean!, namespacePath ID!):
#     https://docs.gitlab.com/api/graphql/reference/#mutationsetvaliditychecks
# Written 2026-11-22.
terraform: [gitlab_project_secret_detection_validity_checks]
shape: settings
params:
  projectId:
    description: The project's numeric ID; the read names the project as gid://gitlab/Project/<projectId>.
  fullPath:
    description: The project's full path (namespace/project), which the mutation names it by.
fields:
  enable:
    type: boolean
    description: Whether secret detection validity checks are enabled for the project.
required: [enable]
sample: {projectId: "7", fullPath: example-group/example-project, enable: true}
read:
  query: |
    query SecurityConfigurationValidityChecks($projectId: ProjectID!) {
      securityConfiguration(projectId: $projectId) {
        enable: validityChecksEnabled
      }
    }
  variables: {projectId: "gid://gitlab/Project/{projectId}"}
  result: securityConfiguration
update:
  query: |
    mutation SetValidityChecks($input: SetValidityChecksInput!) {
      setValidityChecks(input: $input) {
        enable: validityChecksEnabled
        errors
      }
    }
  variables:
    input: {namespacePath: "{fullPath}", enable: "{enable}"}
  result: setValidityChecks
