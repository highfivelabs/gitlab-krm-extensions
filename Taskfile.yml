#
# Only the live:* tasks reach a GitLab server, and none of the other tasks
# calls them. Live code is compiled only with -tags live (live_test.go).
# GitLab CE needs about 4 GB of RAM: run the live tasks on an offload VM
# (offload run --machine e2-standard-4 --idle-minutes 60 -- task live:gitlab).
version: "3"

env:
  GOTOOLCHAIN: go1.25.0+auto

tasks:
  check:
    desc: Format, vet, every kind on the fake, every CRD through apiserver validation (no live code)
    cmds:
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go vet -tags live ./...
      - go test ./...

  live:sandbox:gitlab:
    desc: Start GitLab CE in Docker (127.0.0.1:8929), wait until healthy, print the API base URL and a root token
    cmds:
      - hack/live/gitlab-sandbox.sh up

  live:sandbox:gitlab:down:
    desc: Remove the GitLab sandbox container and its token
    cmds:
      - hack/live/gitlab-sandbox.sh down

  live:gitlab:
    desc: Run every kind in hack/live/live.yaml against the sandbox (starts it if needed); writes hack/live/records.json
    cmds:
      - hack/live/gitlab-sandbox.sh run {{.CLI_ARGS}}

  live:sweep:
    desc: Delete every live-test leftover in the sandbox
    cmds:
      - KRM_LIVE=1 KRM_LIVE_SWEEP=1 KRM_LIVE_CREDS="$(hack/live/gitlab-sandbox.sh creds)" go test -tags live -run '^TestLiveSweep$' -count=1 -v .
